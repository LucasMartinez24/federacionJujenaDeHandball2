<div class="p-4 md:p-8 bg-slate-950 min-h-screen">
  <div class="max-w-5xl mx-auto space-y-8">

    <header class="flex flex-col md:flex-row md:items-end justify-between border-b border-white/5 pb-6 gap-4">
      <div class="space-y-2">
        <h2 class="text-3xl md:text-5xl font-black uppercase tracking-tighter text-white leading-none">
          Carga de <span class="text-primary italic">Galería</span>
        </h2>
        <p class="text-xs md:text-sm text-slate-500 font-bold uppercase tracking-widest">
          FJH • Gestión de Contenido Multimedia
        </p>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

      <aside class="lg:col-span-5 space-y-6">
        <div class="bg-slate-900 border border-white/10 rounded-[2.5rem] p-6 md:p-8 shadow-2xl space-y-6">

          <div class="space-y-2">
            <label class="text-[10px] font-black text-primary uppercase tracking-[0.2em] ml-2">Título de la
              Jornada</label>
            <input type="text" [(ngModel)]="titulo" placeholder="Ej: Final Torneo Apertura..."
              class="w-full bg-slate-950 border border-white/10 rounded-2xl py-4 px-6 text-xs text-white font-bold outline-none focus:border-primary shadow-inner transition-all">
          </div>

          <div class="space-y-2">
            <label class="text-[10px] font-black text-primary uppercase tracking-[0.2em] ml-2">Categoría</label>
            <div class="relative">
              <select [(ngModel)]="categoria"
                class="w-full bg-slate-950 border border-white/10 rounded-2xl py-4 px-6 text-xs text-white font-bold outline-none focus:border-primary shadow-inner transition-all appearance-none cursor-pointer">
                <option *ngFor="let cat of categoriasDisponibles" [value]="cat">{{cat}}</option>
              </select>
              <span
                class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none">
                expand_more
              </span>
            </div>
          </div>

          <div class="relative group">
            <input type="file" #fileInput (change)="onFileSelected($event, fileInput)" multiple accept="image/*"
              class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20">

            <div
              class="h-64 bg-slate-950/50 border-2 border-dashed border-white/10 rounded-[2rem] flex flex-col items-center justify-center group-hover:border-primary/50 transition-all gap-4">
              <div
                class="size-16 bg-primary/10 rounded-full flex items-center justify-center text-primary group-hover:scale-110 transition-transform">
                <span class="material-symbols-outlined text-3xl">add_a_photo</span>
              </div>
              <div class="text-center">
                <p class="text-[10px] font-black text-white uppercase tracking-widest">Arrastra tus fotos</p>
                <p class="text-[9px] text-slate-500 font-bold uppercase mt-1">O haz clic para buscar</p>
              </div>
            </div>
          </div>

          <button (click)="subir()" [disabled]="files.length === 0 || isUploading || !titulo"
            class="w-full py-5 bg-primary text-white rounded-2xl font-black uppercase text-xs shadow-xl shadow-primary/20 hover:brightness-110 disabled:opacity-20 active:scale-95 transition-all flex items-center justify-center gap-3">
            <span class="material-symbols-outlined text-lg">{{ isUploading ? 'sync' : 'cloud_upload' }}</span>
            <span>{{ isUploading ? 'PROCESANDO...' : 'PUBLICAR EN WEB' }}</span>
          </button>
        </div>
      </aside>

      <section class="lg:col-span-7">
        <div class="bg-slate-900/30 border border-white/5 rounded-[3rem] p-6 md:p-10 min-h-[500px]">
          <div class="flex items-center justify-between mb-8 border-b border-white/5 pb-4">
            <h3 class="font-black text-white text-xs uppercase tracking-widest flex items-center gap-2">
              <span class="material-symbols-outlined text-primary text-sm">visibility</span>
              Vista Previa ({{ files.length }})
            </h3>
            <button *ngIf="files.length > 0" (click)="limpiar()"
              class="text-[9px] font-black text-red-500 uppercase hover:text-red-400">
              Vaciar Lista
            </button>
          </div>

          <div *ngIf="previews.length > 0; else emptyState"
            class="grid grid-cols-2 sm:grid-cols-3 gap-4 max-h-[60vh] overflow-y-auto pr-2 custom-scrollbar">
            <div *ngFor="let p of previews; let i = index"
              class="relative aspect-square rounded-[1.5rem] overflow-hidden border border-white/10 group animate-in fade-in zoom-in duration-300">
              <img [src]="p" class="w-full h-full object-cover">

              <div
                class="absolute inset-0 bg-red-600/80 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                <button (click)="removePreview(i)"
                  class="size-10 bg-white text-red-600 rounded-full flex items-center justify-center shadow-lg active:scale-90 transition-transform">
                  <span class="material-symbols-outlined font-bold">delete</span>
                </button>
              </div>
            </div>
          </div>

          <ng-template #emptyState>
            <div class="flex flex-col items-center justify-center h-96 text-slate-700">
              <span class="material-symbols-outlined text-7xl mb-4 opacity-10">photo_library</span>
              <p class="text-[10px] font-black uppercase tracking-[0.3em]">No hay fotos seleccionadas</p>
            </div>
          </ng-template>
        </div>
      </section>

    </div>
  </div>
</div>
