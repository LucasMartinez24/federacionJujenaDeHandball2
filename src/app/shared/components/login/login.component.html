<div class="flex w-full h-screen overflow-hidden bg-background-dark font-display">
  <div class="hidden lg:flex lg:w-1/2 relative flex-col justify-center items-center text-white p-12 overflow-hidden">
    <div class="absolute inset-0 bg-cover bg-center z-0"
      style="background-image: linear-gradient(rgba(19, 91, 236, 0.7), rgba(16, 22, 34, 0.8)), url('/img/handball-bg.jpg');">
    </div>
    <div class="relative z-10 flex flex-col items-start max-w-lg">
      <img src="/img/logo.png" alt="Logo Federación" class="w-50 h-50 object-contain">
      <h1 class="text-5xl font-bold leading-tight mb-4">Federación Jujeña de Handball</h1>
    </div>
    <div class="absolute bottom-10 left-12 z-10 text-sm text-white/60">
      © 2026 San Salvador de Jujuy, Jujuy, Argentina.
    </div>
  </div>

  <div class="w-full lg:w-1/2 flex flex-col justify-center bg-background-dark px-6 sm:px-12 md:px-20 lg:px-24">

    <div class="mb-12">
      <button routerLink="/"
        class="group flex items-center gap-2 text-gray-500 hover:text-white transition-all cursor-pointer">
        <span
          class="material-symbols-outlined text-sm group-hover:-translate-x-1 transition-transform">arrow_back</span>
        <span class="text-[10px] font-black uppercase tracking-[0.2em]">Volver a la página principal</span>
      </button>
    </div>

    <div class="mb-10 text-left">
      <h2 class="text-white tracking-tight text-3xl font-bold mb-2">Bienvenido de nuevo</h2>
      <p class="text-gray-400">Ingresa tus credenciales para acceder al panel.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div class="flex flex-col w-full">
        <label for="username" class="text-white text-sm font-medium pb-2">Usuario</label>
        <input id="username" formControlName="username"
          class="flex w-full rounded-lg border border-gray-700 bg-gray-800 h-14 p-[15px] focus:ring-2 focus:ring-primary/50 outline-none transition-all text-gray-300 placeholder:text-gray-400/50"
          placeholder="ej. admin" type="text" />
        <p class="mt-1 text-xs text-gray-500">Usa tu nombre de usuario asignado.</p>
      </div>

      <div class="flex flex-col w-full">
        <label for="password" class="text-white text-sm font-medium pb-2">Contraseña</label>
        <div class="flex w-full items-stretch rounded-lg">
          <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password"
            class="flex w-full min-0 flex-1 rounded-l-lg border border-r-0 border-gray-700 bg-gray-800 h-14 p-[15px] outline-none text-gray-300" />
          <button type="button" (click)="togglePassword()"
            class="text-white flex border border-gray-700 bg-gray-800 items-center justify-center px-4 rounded-r-lg cursor-pointer hover:text-primary transition-colors">
            <span class="material-symbols-outlined">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
      </div>

      <div class="pt-4">
        <button [disabled]="loginForm.invalid || loading"
          class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-lg transition-all shadow-lg shadow-primary/20 flex items-center justify-center space-x-2 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
          type="submit">
          <span>{{ loading ? 'Iniciando sesión...' : 'Iniciar sesión' }}</span>
          <span class="material-symbols-outlined text-xl">{{ loading ? 'hourglass_empty' : 'login' }}</span>
        </button>
      </div>

      <div *ngIf="error" class="mt-4 p-3 bg-red-900/30 text-red-400 rounded-lg text-sm">
        {{ error }}
      </div>
    </form>
  </div>
</div>
